server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type text/html;

    types {
        font/woff2 woff2;
        font/woff woff;
        font/ttf ttf;
        font/otf otf;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
