when:
  - event: ["push"]
    branch: ["main"]
engine: microvm
image: alpine

steps:
  - name: "Deploy"
    command: |
      set -eu

      : "${TS_OAUTH_CLIENT_ID:?Set the Tailscale OAuth client ID as a Tangled secret named TS_OAUTH_CLIENT_ID}"
      : "${TS_OAUTH_SECRET:?Set the Tailscale OAuth secret as a Tangled secret named TS_OAUTH_SECRET}"
      : "${TS_ADVERTISE_TAGS:?Set TS_ADVERTISE_TAGS to a tag allowed for the Tailscale OAuth client, such as tag:deploy}"
      : "${OP_SERVICE_ACCOUNT_TOKEN:?Set the 1Password service account token as a Tangled secret named OP_SERVICE_ACCOUNT_TOKEN}"
      : "${OP_SSH_KEY_REF:?Set OP_SSH_KEY_REF to the op:// reference for the spruce SSH private key in 1Password}"

      umask 077

      SSH_KEY_FILE="$HOME/.ssh/spruce-deploy-key"
      cleanup() {
        if [ -n "${SSH_AGENT_PID:-}" ]; then
          ssh-agent -k >/dev/null 2>&1 || true
        fi
        if [ -n "${TS_DAEMON_PID:-}" ]; then
          kill "$TS_DAEMON_PID" 2>/dev/null || true
        fi
        for tpl in */.env.tpl; do rm -f "${tpl%.tpl}"; done
        rm -f "$SSH_KEY_FILE" "$HOME/.ssh/config" /tmp/op.zip
        rm -f /tmp/tailscaled.state /tmp/tailscaled.log /tmp/tailscaled.sock
      }
      trap cleanup EXIT

      echo "Installing Alpine deployment tools"
      apk add --no-cache ca-certificates-bundle curl netcat-openbsd openssh-client tailscale unzip

      TS_SOCKET=/tmp/tailscaled.sock
      TS_LOG=/tmp/tailscaled.log
      echo "Starting tailscaled"
      tailscaled --tun=userspace-networking --socks5-server=127.0.0.1:1055 \
        --state=/tmp/tailscaled.state --socket="$TS_SOCKET" > "$TS_LOG" 2>&1 &
      TS_DAEMON_PID=$!

      i=0
      while [ ! -S "$TS_SOCKET" ] && [ "$i" -lt 30 ]; do
        sleep 1
        i=$((i + 1))
      done
      if [ ! -S "$TS_SOCKET" ]; then
        echo "tailscaled failed to start:" >&2
        cat "$TS_LOG" >&2
        exit 1
      fi

      echo "Authenticating this runner with Tailscale"
      if ! tailscale --socket="$TS_SOCKET" login --timeout=2m \
        --client-id "$TS_OAUTH_CLIENT_ID" \
        --client-secret "$TS_OAUTH_SECRET" \
        --advertise-tags "$TS_ADVERTISE_TAGS"; then
        echo "Tailscale login failed; daemon log follows:" >&2
        cat "$TS_LOG" >&2
        exit 1
      fi
      if ! tailscale --socket="$TS_SOCKET" up --timeout=2m; then
        echo "Tailscale failed to come up; daemon log follows:" >&2
        cat "$TS_LOG" >&2
        exit 1
      fi
      if ! nc -z 127.0.0.1 1055; then
        echo "Tailscale SOCKS5 proxy did not start; daemon log follows:" >&2
        cat "$TS_LOG" >&2
        exit 1
      fi
      echo "Tailscale is connected through the userspace SOCKS5 proxy"
      unset TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET TS_ADVERTISE_TAGS

      case "$(uname -m)" in
        x86_64) OP_ARCH=amd64 ;;
        aarch64) OP_ARCH=arm64 ;;
        *) echo "Unsupported architecture for 1Password CLI: $(uname -m)" >&2; exit 1 ;;
      esac
      OP_VERSION=2.30.3
      curl -fsSL -o /tmp/op.zip \
        "https://cache.agilebits.com/dist/1P/op2/pkg/v${OP_VERSION}/op_linux_${OP_ARCH}_v${OP_VERSION}.zip"
      unzip -p /tmp/op.zip op > /usr/local/bin/op
      chmod 755 /usr/local/bin/op
      rm -f /tmp/op.zip

      mkdir -p "$HOME/.ssh"
      chmod 700 "$HOME/.ssh"
      echo "Retrieving the SSH key from 1Password"
      op read "$OP_SSH_KEY_REF" > "$SSH_KEY_FILE"
      chmod 600 "$SSH_KEY_FILE"
      eval "$(ssh-agent -s)" >/dev/null
      ssh-add "$SSH_KEY_FILE"

      echo "Rendering service .env files from 1Password"
      for tpl in */.env.tpl; do
        op inject -f -i "$tpl" -o "${tpl%.tpl}" >/dev/null
      done
      unset OP_SERVICE_ACCOUNT_TOKEN OP_SSH_KEY_REF
      cat > "$HOME/.ssh/config" <<EOF
      Host spruce
        HostName spruce
        User cypress
        IdentityFile $SSH_KEY_FILE
        IdentitiesOnly yes
        ProxyCommand nc -X 5 -x 127.0.0.1:1055 %h %p
        StrictHostKeyChecking accept-new
      EOF
      chmod 600 "$HOME/.ssh/config"

      echo "Uploading service .env files"
      tar -cf - */.env | ssh spruce 'umask 077 && rm -rf ~/.cache/spruce-infra-env &&
        mkdir -p ~/.cache/spruce-infra-env && tar -xf - -C ~/.cache/spruce-infra-env'

      echo "Deploying Quadlet units on spruce"
      ssh spruce 'set -eu
        cd ~/spruce-infra
        old=$(git rev-parse HEAD)
        git pull --ff-only
        ./deploy.sh --since "$old" --env-dir ~/.cache/spruce-infra-env'

      tailscale --socket="$TS_SOCKET" logout || true
